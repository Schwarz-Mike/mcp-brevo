# nginx vhost for mcp-brevo.mikeschwarz.ch  ->  127.0.0.1:3104
# ---------------------------------------------------------------------------
# Managed panel (CloudPanel etc.): create the site + Let's Encrypt cert in the
# panel, then paste ONLY the `location /` block below into the generated vhost.
# Standalone nginx: use this whole file (adjust the certificate paths), then:
#   sudo ln -s /etc/nginx/sites-available/mcp-brevo.mikeschwarz.ch \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d mcp-brevo.mikeschwarz.ch
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name mcp-brevo.mikeschwarz.ch;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp-brevo.mikeschwarz.ch;

    ssl_certificate     /etc/letsencrypt/live/mcp-brevo.mikeschwarz.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp-brevo.mikeschwarz.ch/privkey.pem;

    # OAuth discovery must stay publicly reachable (no basic-auth).
    location /.well-known { auth_basic off; allow all; }

    location / {
        proxy_pass http://127.0.0.1:3104;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $http_connection;

        proxy_connect_timeout 900;
        proxy_send_timeout    900;
        proxy_read_timeout    900;

        # SSE / MCP streaming support (essential for the MCP transport).
        proxy_buffering            off;
        proxy_cache                off;
        chunked_transfer_encoding  on;
    }
}
